services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: financedb
      POSTGRES_USER: datasquire_owner
      POSTGRES_PASSWORD: owner_pw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datasquire_owner"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
